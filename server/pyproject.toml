[project]
name = "quill-server"
version = "0.2.0"
description = "Speaker-attributed transcription for quill sessions, in front of a vLLM model server"
requires-python = ">=3.12"
dependencies = [
    "av>=14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
