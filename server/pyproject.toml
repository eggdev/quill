[project]
name = "quill-server"
version = "0.1.0"
description = "Transcription and speaker diarization for quill sessions, served on a GPU host"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "torchaudio>=2.9",
    "nemo_toolkit[asr]>=2.5",
    "av>=14",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
